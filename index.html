<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProgressBar Animations</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        .progress-container {
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <h2>Progress Bar Animations</h2>

    <div class="progress-container" id="progress-multicolor"></div>
    <div class="progress-container" id="progress-pulse"></div>
    <div class="progress-container" id="progress-wave"></div>
    <div class="progress-container" id="progress-fire"></div>
    <div class="progress-container" id="progress-ocean"></div>
    <div class="progress-container" id="progress-neon"></div>
    <div class="progress-container" id="progress-fade"></div>
    
    <button onclick="ajustar()">Click me</button>

    <script src="js/progressbar.min.js"></script>
    <script>
        const types = ["multicolor", "pulse", "wave", "fire", "ocean", "neon", "fade"];
        const progressBars = {}; // Objeto para almacenar las instancias

        types.forEach(type => {
            progressBars[type] = new ProgressBar({
                parent: `#progress-${type}`,
                width: '300px',
                height: '30px',
                fillColor: type, // Usa cada tipo de animación
                backgroundColor: '#ddd',
                maxValue: 100,
                value: 50,
                showText: true,
                animationSpeed: 400
            });
        });

        function ajustar() {
            progressBars["multicolor"].update(75);
        }
    </script>

</body>
</html>
